name: eden-emulator
base: core24
version: '0.2.1'
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: Eden, Switch Emulator
description: |
  An open-source Switch emulator, forked from the Yuzu emulator
grade: stable
confinement: strict
compression: lzo

apps:
  eden-emulator:
    command-chain: [desktop-launch-eden]
    command: usr/bin/eden
    desktop: usr/share/applications/dev.eden_emu.eden.desktop
    common-id: dev.eden_emu.eden
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
    extensions: [kde-neon-6]
    plugs:
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - system-observe
      - joystick
      - bluez
      - udisks2

plugs:
  shared-memory:
    private: true

parts:
  eden-emulator-app:
    plugin: cmake
    source: https://git.eden-emu.dev/eden-emu/eden.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - libssl-dev
      - pkg-config
      - libsdl2-dev
      - libavfilter-dev
      - libavcodec-dev
      - libswscale-dev
      - rapidjson-dev
      - libusb-1.0-0-dev
      - libbrotli-dev
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DBUILD_TESTING=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DYUZU_USE_BUNDLED_QT=OFF
      - -DYUZU_USE_QT_MULTIMEDIA=OFF
      - -DYUZU_USE_QT_WEB_ENGINE=OFF
      - -DENABLE_QT_TRANSLATION=ON
      - -DENABLE_UPDATE_CHECKER=OFF
      - -DUSE_DISCORD_PRESENCE=ON
      - -DENABLE_LTO=ON
      - -DYUZU_USE_BUNDLED_SIRIT=OFF
      - -DYUZU_USE_BUNDLED_FFMPEG=OFF
      - -DYUZU_USE_BUNDLED_OPENSSL=OFF
      - -DYUZU_DISABLE_LLVM=ON
      - -DYUZU_STATIC_BUILD=OFF
      - -DYUZU_CMD=OFF
      - -DYUZU_ROOM_STANDALONE=OFF
      - -DNIGHTLY_BUILD=OFF
      - -DYUZU_USE_BUNDLED_SDL2=OFF
      - -DVulkanHeaders_FORCE_BUNDLED=ON
      - -Dzstd_FORCE_BUNDLED=ON
    override-build: |
      craftctl default
      sed -i 's|Name=Eden|Name=Eden [Kyu]|' $CRAFT_PART_INSTALL/usr/share/applications/dev.eden_emu.eden.desktop
      sed -i 's|Icon=dev.eden_emu.eden|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/dev.eden_emu.eden.svg|' $CRAFT_PART_INSTALL/usr/share/applications/dev.eden_emu.eden.desktop
      sed -i 's|StartupWMClass=eden|StartupWMClass=dev.eden_emu.eden|' $CRAFT_PART_INSTALL/usr/share/applications/dev.eden_emu.eden.desktop

  dependencies:
    after: [eden-emulator-app]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libdecor-0-0
    prime:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libSDL2-2.0.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor-0.so*

  other-files:
    after: [dependencies]
    plugin: dump
    source: ./other-files
    prime: [desktop-launch-eden]
